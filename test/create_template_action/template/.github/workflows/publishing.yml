name: Publishing Test

on:
  # repository_dispatch:
  #   types: [start-test]
  workflow_dispatch:
    #checkov:skip=CKV_GHA_7:This tool needs input from test client
    inputs:
      # As requested by codex-/return-dispatch@v1
      distinct_id:
        type: string
        required: true

permissions: read-all

jobs:
  test-publishing:
    name: Publish to another repo
    runs-on: ubuntu-latest
    steps:
      - name: echo distinct ID ${{ github.event.inputs.distinct_id }} # As requested by codex-/return-dispatch@v1
        run: echo "${DISTINCT_ID}"
        env:
          DISTINCT_ID: ${{ github.event.inputs.distinct_id }}

      - name: Checkout
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Test if we can publish
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          external_repository: fletort-test/init-repo-action-test-published
          publish_branch: main
          deploy_key: ${{ secrets.PUBLISHING_KEY }}
          publish_dir: ./
