name: Template Creation
description: "Action to Init the local Test Template Repository."
inputs:
  repo_name:
    required: true
  repo_org:
    required: true
  is_template:
    default: true
  token:
    required: true
  uuid_filename:
    default: uuid.txt

outputs:
  uuid:
    description: "The created uuid"
    value: ${{ steps.copy_content.outputs.uuid }}

runs:
  using: "composite"
  steps:
    - name: Checkout Local Repo
      id: checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Create Template repository
      shell: bash
      run: |
        gh repo create ${REPOSITORY} --public --add-readme
      env:
        GH_TOKEN: "${{ inputs.token }}"
        REPOSITORY: "${{ inputs.repo_org }}/${{ inputs.repo_name }}"

    - name: Switch repository as a template
      if: ${{ inputs.is_template }}
      shell: bash
      run: |
        gh repo edit "${REPO_ORG}/${REPO_NAME}" --template
      env:
        GH_TOKEN: "${{ inputs.token }}"
        REPO_NAME: ${{ inputs.repo_name }}
        REPO_ORG: ${{ inputs.repo_org }}
    - name: Checkout Template repository
      id: checkout_template
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        repository: ${{ inputs.repo_org }}/${{ inputs.repo_name }}
        path: ${{ inputs.repo_name }}
        token: ${{ inputs.token }}
        persist-credentials: false
    - name: Copy test workflow & content
      id: copy_content
      shell: bash
      run: |
        cp -r ${{ github.action_path }}/template/. ${REPO_NAME}/
        uuid=$(uuidgen)
        echo $uuid > ${REPO_NAME}/${TEST_UUID_FILENAME}
        echo "uuid=${uuid}" >> "$GITHUB_OUTPUT"
        repo=${{ github.repository }}
        repo_escape="${repo/\//\\\/}"
        sed -i -e "s/.\//${repo_escape}@${{ github.sha }}/g" ${REPO_NAME}/.github/workflows/auto_init.yml
      env:
        REPO_NAME: ${{ inputs.repo_name }}
        TEST_UUID_FILENAME: ${{ inputs.uuid_filename }}
    - name: Commit & Push changes To Template repository
      uses: actions-js/push@968f4695ca558093eadb24ad83cc5891f47e0cdc # master
      with:
        github_token: "${{ inputs.token }}"
        directory: ${{ inputs.repo_name }}
        repository: ${{ inputs.repo_org }}/${{ inputs.repo_name }}
