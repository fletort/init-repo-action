name: Test in AutoInit Mode with all feature
on:
  workflow_call:
    secrets:
      TEST_TOKEN:
        required: true
      TESTSPACE_TOKEN:
        required: true

permissions: read-all

jobs:
  test_autoinit_prerequisite:
    name: Prerequisite
    runs-on: ubuntu-latest
    outputs:
      uuid: ${{ steps.create_autoinit.outputs.uuid }}
    steps:
      - name: Clean Test Data
        env:
          GH_TOKEN: ${{ secrets.TEST_TOKEN }}
          VARS_TEST_AUTOINIT_REPO_ORG: ${{ vars.TEST_AUTOINIT_REPO_ORG }}
          VARS_TEST_AUTOINIT_REPO_NAME: ${{ vars.TEST_AUTOINIT_REPO_NAME }}
        run: |
          gh repo delete "${VARS_TEST_AUTOINIT_REPO_ORG}/${VARS_TEST_AUTOINIT_REPO_NAME}" --yes || true

      - name: Checkout Local Repo
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create AutoInit repository
        id: create_autoinit
        uses: ./test/create_template_action/
        with:
          repo_name: ${{ vars.TEST_AUTOINIT_REPO_NAME }}
          repo_org: ${{ vars.TEST_AUTOINIT_REPO_ORG }}
          token: ${{ secrets.TEST_TOKEN }}
          uuid_filename: ${{ vars.TEST_UUID_FILENAME }}
          is_template: false

      - name: Add Secret To AutoInit repository
        run: |
          gh secret set TEST_TOKEN --repo "${VARS_TEST_AUTOINIT_REPO_ORG}/${VARS_TEST_AUTOINIT_REPO_NAME}" --body "${{ secrets.TEST_TOKEN }}"
          gh secret set TESTSPACE_TOKEN --repo "${VARS_TEST_AUTOINIT_REPO_ORG}/${VARS_TEST_AUTOINIT_REPO_NAME}" --body "${{ secrets.TESTSPACE_TOKEN }}"
        env:
          GH_TOKEN: ${{ secrets.TEST_TOKEN }}
          VARS_TEST_AUTOINIT_REPO_ORG: ${{ vars.TEST_AUTOINIT_REPO_ORG }}
          VARS_TEST_AUTOINIT_REPO_NAME: ${{ vars.TEST_AUTOINIT_REPO_NAME }}

  run_autoinit_action:
    name: Run
    needs: test_autoinit_prerequisite
    runs-on: ubuntu-latest
    outputs:
      testspace_space_id: ${{ steps.output.outputs.testspace_space_id }}
    steps:
      # Dispatch an action and get the run ID and URL
      - name: Start the AutoInit Workflow
        uses: codex-/return-dispatch@85e564d60eaec3cc4aca885373d510cfe4bd5b19 # v4.0.1
        id: return_dispatch
        with:
          token: ${{ secrets.TEST_TOKEN }}
          ref: main
          repo: ${{ vars.TEST_AUTOINIT_REPO_NAME }}
          owner: ${{ vars.TEST_AUTOINIT_REPO_ORG }}
          workflow: auto_init.yml
          workflow_inputs: '{ "repository_deployment": "${{ vars.TEST_PUBLISHED_REPO_ORG }}/${{ vars.TEST_PUBLISHED_REPO_NAME }}" }'

      # Await Run ID ${{ steps.return_dispatch.outputs.run_id }}
      - name: Waiting end of the AutoInit Workflow
        uses: Codex-/await-remote-run@a56c556e6434d2d7ec9438dc656143b39532324e # v1.13.0
        with:
          token: ${{ github.token }}
          repo: ${{ vars.TEST_AUTOINIT_REPO_NAME }}
          owner: ${{ vars.TEST_AUTOINIT_REPO_ORG }}
          run_id: ${{ steps.return_dispatch.outputs.run_id }}

      - name: Gets Workflow Output
        id: output
        run: |
          line=$(gh run view "${STEPS_RETURN_DISPATCH_OUTPUTS_RUN_ID}" -R "${VARS_TEST_AUTOINIT_REPO_ORG}/${VARS_TEST_AUTOINIT_REPO_NAME}" --json jobs --jq '.jobs[].steps[] | select( .name | contains("TestSpace")) | .name')
          [[ $line =~ ([1-9]+) ]]
          id=${BASH_REMATCH[1]}
          echo "testspace_space_id=${id}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.TEST_TOKEN }}
          STEPS_RETURN_DISPATCH_OUTPUTS_RUN_ID: ${{ steps.return_dispatch.outputs.run_id }}
          VARS_TEST_AUTOINIT_REPO_ORG: ${{ vars.TEST_AUTOINIT_REPO_ORG }}
          VARS_TEST_AUTOINIT_REPO_NAME: ${{ vars.TEST_AUTOINIT_REPO_NAME }}

  test_autoinit_result:
    name: Check
    needs: [test_autoinit_prerequisite, run_autoinit_action]
    uses: ./.github/workflows/reusable_test_result.yml
    with:
      testspace_id: ${{ needs.run_autoinit_action.outputs.testspace_space_id }}
      waited_uuid: ${{needs.test_autoinit_prerequisite.outputs.uuid}}
      repo_name: ${{ vars.TEST_AUTOINIT_REPO_NAME }}
      repo_org: ${{ vars.TEST_AUTOINIT_REPO_ORG }}
      test_name: test_autoinit
    secrets: inherit # zizmor: ignore[secrets-inherit]

  clean:
    if: always()
    name: Clean
    needs: [test_autoinit_result]
    runs-on: ubuntu-latest
    steps:
      - name: Clean Test Data
        env:
          GH_TOKEN: ${{ secrets.TEST_TOKEN }}
          VARS_TEST_AUTOINIT_REPO_ORG: ${{ vars.TEST_AUTOINIT_REPO_ORG }}
          VARS_TEST_AUTOINIT_REPO_NAME: ${{ vars.TEST_AUTOINIT_REPO_NAME }}
        run: |
          gh repo delete "${VARS_TEST_AUTOINIT_REPO_ORG}/${VARS_TEST_AUTOINIT_REPO_NAME}" --yes || true
